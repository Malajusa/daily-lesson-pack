name: Orchestration source snapshot
on:
  push:
    branches: [feat/agent-orchestration-v2-20260908]
    paths: [.github/workflows/orchestration-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for isolated verification
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: orchestration-source
          path: source.zip
          retention-days: 1
