name: Apply verified orchestration patch
on:
  push:
    branches: [feat/agent-orchestration-v2-20260908]
    paths: [.github/workflows/orchestration-apply-verified-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Malajusa/daily-lesson-pack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify exact locally tested patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          import urllib.request

          chunks = [
              'ecb63dfd44d3cdcf2c8530c2d7b6c2b6ba68b09d',
              '5d03574e6324a87ba16a4c0e411e8faec88078b1',
              '1d1807aa109c2c447050e8c6e72553aab8173fc7',
              '645529a1ccd60d3a2e0385aa53362ceeef8fe67e',
          ]
          data = []
          for sha in chunks:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/Malajusa/daily-lesson-pack/git/blobs/{sha}',
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  blob = json.load(response)
              if blob.get('encoding') != 'base64':
                  raise SystemExit('Unexpected blob encoding')
              chunk = base64.b64decode(blob['content'])
              header = f'blob {len(chunk)}\0'.encode()
              if hashlib.sha1(header + chunk).hexdigest() != sha:
                  raise SystemExit('Blob checksum mismatch')
              data.append(chunk)
          compressed = b''.join(data)
          if len(compressed) != 39876 or hashlib.sha256(compressed).hexdigest() != '1e963ee8d5343bf2650f65afceceab53c3e219d6861a007a0b463a5e032dc526':
              raise SystemExit('Compressed patch checksum mismatch')
          patch = lzma.decompress(compressed)
          if len(patch) != 222697 or hashlib.sha256(patch).hexdigest() != 'a7cfafe94a62d98de13d8cf8ba1d82dc5a0d39aeacfe84fa51f7b111faa955e8':
              raise SystemExit('Patch checksum mismatch')
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index'], input=patch, check=True)
          subprocess.run(['git', 'rm', '.github/workflows/orchestration-apply-verified-patch.yml'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if tree != 'e51477b6b2b23bc971446b476fd7184adca3b8a9':
              raise SystemExit('Resulting source tree differs from verified local tree: ' + tree)
          print('Verified exact source tree:', tree)
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify applied source
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q scripts
          git diff --cached --check
      - name: Commit tested source to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement validated v2 agent orchestration above existing release pipeline'
          git push origin HEAD:refs/heads/feat/agent-orchestration-v2-20260908
