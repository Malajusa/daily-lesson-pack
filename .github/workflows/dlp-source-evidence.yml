name: DLP source evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Record source identity
        run: |
          mkdir -p /tmp/dlp-evidence
          git rev-parse HEAD > /tmp/dlp-evidence/SOURCE_COMMIT.txt
          git archive --format=zip HEAD > /tmp/dlp-evidence/source.zip
          sha256sum /tmp/dlp-evidence/source.zip > /tmp/dlp-evidence/SHA256SUMS.txt
      - name: Run deterministic tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/dlp-evidence/tests.log
      - name: Retain source and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlp-source-evidence-${{ github.event.pull_request.head.sha }}
          path: /tmp/dlp-evidence/
          if-no-files-found: error
          retention-days: 7
