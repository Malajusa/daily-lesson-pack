name: Apply verified release-hardening patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'Malajusa/daily-lesson-pack' && github.event.pull_request.number == 12 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/release-readiness-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply exact previously tested patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import bz2, hashlib, subprocess
          expected = '4374324068dc1ea8906795a7955b9b095c0b34c19dd188bf2303d718023bef7f'
          parts = [Path(f'_maintenance/release-hardening/part-{i:02d}.bz2') for i in range(4)]
          patch = bz2.decompress(b''.join(p.read_bytes() for p in parts))
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Publication patch digest mismatch')
          destination = Path('/tmp/dlp-publication')
          destination.mkdir()
          path = destination / 'implementation.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          (destination / 'PATCH_SHA256.txt').write_text(expected + '\n')
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Re-run complete test suite before publication
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/dlp-publication/tests.log
          git diff --cached --check
      - name: Publish only to the approved feature branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/release-readiness-20260909 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement scoped creator settings and exact-package release hardening' -m 'Applied SHA-256 verified patch 4374324068dc1ea8906795a7955b9b095c0b34c19dd188bf2303d718023bef7f; complete deterministic suite passed before commit. Candidate only; no classroom or independent-review claim.'
          git rev-parse HEAD > /tmp/dlp-publication/PUBLISHED_COMMIT.txt
          git push origin HEAD:refs/heads/fix/release-readiness-20260909
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlp-publication-${{ github.event.pull_request.head.sha }}
          path: /tmp/dlp-publication/
          if-no-files-found: error
          retention-days: 7
