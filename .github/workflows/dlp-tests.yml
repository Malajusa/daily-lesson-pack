name: Daily Lesson Pack tests

on:
  push:
    branches:
      - main
      - enforce-dlp-build-release-pipeline-20260908
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip python-pptx PyMuPDF
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build complete package
        run: python scripts/build_chatgpt_package.py --out dist/chatgpt/daily-lesson-pack.zip
      - name: Verify complete package
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          destination = Path('/tmp/dlp-complete')
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)
          with zipfile.ZipFile('dist/chatgpt/daily-lesson-pack.zip') as archive:
              archive.extractall(destination)
          PY
          python scripts/audit_package_dependencies.py --skill-root /tmp/dlp-complete/daily-lesson-pack
      - name: Build component packages
        run: python scripts/package_component_skills.py --out dist/component-skills
      - name: Verify component packages
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import zipfile

          package_dir = Path('dist/component-skills')
          verification_root = Path('/tmp/dlp-components')
          shutil.rmtree(verification_root, ignore_errors=True)
          verification_root.mkdir(parents=True)

          packages = sorted(package_dir.glob('dlp-*.zip'))
          if len(packages) != 8:
              raise SystemExit(f'Expected 8 component packages, found {len(packages)}')

          for package in packages:
              destination = verification_root / package.stem
              destination.mkdir(parents=True)
              with zipfile.ZipFile(package) as archive:
                  archive.extractall(destination)
              skill_root = destination / package.stem
              subprocess.run(
                  [
                      sys.executable,
                      'scripts/audit_package_dependencies.py',
                      '--skill-root',
                      str(skill_root),
                      '--component',
                  ],
                  check=True,
              )
          PY
