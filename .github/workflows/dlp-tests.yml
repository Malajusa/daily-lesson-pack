name: Daily Lesson Pack tests

on:
  push:
    branches:
      - main
      - enforce-dlp-build-release-pipeline-20260908
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip python-pptx PyMuPDF
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
